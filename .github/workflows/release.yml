name: Release

# Every push to main builds a fresh .vsix and publishes it as a release, so the
# installable artifact always matches the code that was just merged.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vsix:
    name: Build and publish the .vsix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Bundle the extension (self-contained dist)
        run: npm run build:bundle

      - name: Verify the bundled artifact loads
        run: node test/bundle.cjs

      - name: Read the version
        id: version
        run: |
          VERSION=$(node -p "require('./extension/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package the .vsix
        run: |
          cd extension
          npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository \
            --out "../ai-bridge-${{ steps.version.outputs.version }}.vsix"

      - name: Upload the .vsix as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-bridge-${{ steps.version.outputs.version }}
          path: ai-bridge-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

      - name: Publish / update the release
        uses: softprops/action-gh-release@v2
        with:
          # A tag push owns its tag; a branch push updates a rolling release.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: AI Bridge ${{ steps.version.outputs.version }}
          body: |
            Automated build from ${{ github.sha }}.

            Install: download the `.vsix` and run
            `code --install-extension ai-bridge-${{ steps.version.outputs.version }}.vsix`.
          files: ai-bridge-${{ steps.version.outputs.version }}.vsix
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
