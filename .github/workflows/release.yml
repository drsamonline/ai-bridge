name: Release

# Publishes a GitHub release ONLY when the version in extension/package.json has
# changed (no tag `vX.Y.Z` exists yet). A normal push that does not bump the
# version builds and tests but publishes nothing.
#
# To cut a release: `npm run version:bump patch` (or minor/major), commit, push.

on:
  push:
    branches: [main]
    paths:
      - 'extension/package.json'
      - 'package.json'
      - 'shared/**'
      - 'bridge/**'
      - 'extension/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-release the current version even if the tag exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- version
  version:
    name: Read the version and decide
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      changed: ${{ steps.read.outputs.changed }}
      notes: ${{ steps.read.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags are needed to know what is already released

      - name: Read version and check for an existing tag
        id: read
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/package.json').version")
          MANIFEST_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::warning::root package.json is $MANIFEST_VERSION but the extension is $VERSION — using $VERSION"
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version $VERSION — releasing."
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "Automated release of **$VERSION** from \`${GITHUB_SHA::7}\`."
            echo ""
            echo "Install:"
            echo ""
            echo '```bash'
            echo "code --install-extension ai-bridge-$VERSION.vsix"
            echo '```'
            echo ""
            echo "See the [README](https://github.com/${{ github.repository }}#readme) for setup, and the"
            echo "[honest status section](https://github.com/${{ github.repository }}#what-is-actually-proven) for what is and is not proven."
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Note the decision
        run: |
          echo "### Release decision" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`${{ steps.read.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- changed: \`${{ steps.read.outputs.changed }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ verify
  verify:
    name: Build and test
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          echo "CHROME_BIN=$(command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Contract tests
        run: npm run build && node test/contract.cjs
      - name: Full suite
        run: |
          npm run build
          npm run build:bundle
          # Bounded per suite: a hang names itself instead of consuming the job
          # timeout in silence, which is what launch.cjs did for 27 minutes.
          node scripts/run-suites.mjs --timeout=200

  # ----------------------------------------------------------------- package
  # Runs on every push: the rolling "latest build" release always gets a fresh
  # .vsix, so there is always something downloadable without bumping a version.
  package:
    name: Build the .vsix
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level on purpose: a step's `if` cannot read its own `env`, so a
    # conditional on OVSX_PAT would always be false if it lived on the step.
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    permissions:
      contents: write
      # Trusted publishing: the workflow proves its identity with a short-lived
      # OIDC token instead of a stored secret. Harmless when unused.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Compile and bundle
        run: |
          npm run build
          npm run build:bundle
      - name: Verify the bundle loads
        run: node test/bundle.cjs
      - name: Pack the vsix
        run: node scripts/make-vsix.mjs
      - name: Check what is inside
        run: |
          unzip -l "ai-bridge-${{ needs.version.outputs.version }}.vsix"
          test -f "ai-bridge-${{ needs.version.outputs.version }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-bridge-${{ needs.version.outputs.version }}
          path: ai-bridge-${{ needs.version.outputs.version }}.vsix
          if-no-files-found: error
      # --- Open VSX: the gallery VSCodium reads --------------------------
      # Two phases, because the registry requires the extension to exist before a
      # trusted publisher can be registered for it:
      #
      #   1. first publish — OVSX_PAT set, and the CLI uses it (a token always
      #      takes precedence);
      #   2. after registering the trusted publisher at
      #      https://open-vsx.org/user-settings/trusted-publishers and DELETING the
      #      secret — no token is present, so the CLI exchanges the workflow's OIDC
      #      identity for a five-minute publishing token.
      #
      # Deleting the secret is not optional: while it exists, it wins and the
      # workflow is not actually using trusted publishing.
      #
      # `--skip-duplicate` keeps a re-run of the same version from failing.
      - name: Publish to Open VSX
        continue-on-error: true
        run: |
          npx --yes ovsx@latest publish "ai-bridge-${{ needs.version.outputs.version }}.vsix" --skip-duplicate
      - name: Explain an Open VSX skip
        if: ${{ env.OVSX_PAT == '' }}
        run: |
          echo "No OVSX_PAT: this run used trusted publishing if a registration exists."
          echo "Before the first publish or the registration, the publish above fails softly."
          echo "See https://open-vsx.org/user-settings/trusted-publishers"
      # --- 1. rolling build: replaced on every push -----------------------
      - name: Publish the rolling build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Rolling build of `main` — replaced on every push.

            Commit `${{ github.sha }}` · version `${{ needs.version.outputs.version }}`

            Install:
            ```bash
            code --install-extension ai-bridge-${{ needs.version.outputs.version }}.vsix
            ```
          files: ai-bridge-${{ needs.version.outputs.version }}.vsix
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 2. versioned release: only when the version is new -------------
      - name: Publish the versioned release
        if: needs.version.outputs.changed == 'true' || inputs.force == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: AI Bridge ${{ needs.version.outputs.version }}
          body: ${{ needs.version.outputs.notes }}
          files: ai-bridge-${{ needs.version.outputs.version }}.vsix
          fail_on_unmatched_files: true
          make_latest: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
