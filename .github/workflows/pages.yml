name: Landing page

# Publishes docs/ to GitHub Pages whenever the landing page or its screenshots
# change. The page is self-contained; only the images and the icon are external.
#
# This workflow is what makes "Source: GitHub Actions" work: without a workflow
# that uploads an artifact and deploys it, the site has a source and nothing to
# serve, which shows up as 502 on every path.
#
# Runs on every push to main as well, so a re-deploy is always one commit away.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'extension/media/icon.png'
      - '.github/workflows/pages.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the page and its assets
        run: |
          test -f docs/index.html || (echo "docs/index.html missing" && exit 1)
          test -f docs/screenshots/chat-panel.png || (echo "screenshot missing" && exit 1)
          grep -q 'screenshots/chat-panel.png' docs/index.html
          # `docs/` IS the site root, so every relative asset the page references
          # must exist inside it. A path that escapes the root — ../extension/...
          # — resolves to nothing on Pages, which is how the icon broke.
          # A `../` asset resolves on disk but escapes the artifact, so existence
          # is not enough — the path itself has to stay inside the root. That is
          # the difference between `test -f` passing locally and a 404 on Pages.
          missing=0
          for asset in $(grep -oE '(src|href)="[^"]+"' docs/index.html \
            | sed -E 's/.*="([^"]+)"/\1/' \
            | grep -vE '^(https?:|#|mailto:)' \
            | sort -u); do
            clean="${asset%%\?*}"
            case "$clean" in
              *..*|/*)
                echo "asset escapes the site root: $asset"
                missing=1
                continue
                ;;
            esac
            if [ ! -f "docs/$clean" ]; then
              echo "missing asset: $asset (expected docs/$clean)"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
