name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: Contract + unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (the CDP suites drive a real browser)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          echo "CHROME_BIN=$(command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Contract tests (fake DOM fixtures)
        run: node test/contract.cjs

      - name: Full suite
        run: npm run test:all

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-evidence
          path: docs/batch-*.md
          if-no-files-found: warn

  # Windows is the platform this project has never run on. This job proves the
  # part that can be proved without a browser: the TypeScript compiles, the
  # bundle builds, and every suite that does not drive Chromium passes. The CDP
  # and fixture-browser suites stay on Linux, where they are known to work —
  # adding them here would produce a red run that says nothing about the code.
  windows:
    name: Windows (build + browser-free suites)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle
        run: npm run build:bundle

      - name: Browser-free suites
        shell: bash
        run: |
          set -e
          # Derived, not hand-listed: a suite that mentions a browser is skipped.
          # The first version of this job carried a hand-written list and included
          # settings-panel, which spawns Chromium — the run died at 11 of 22.
          for file in test/*.cjs; do
            suite=$(basename "$file" .cjs)
            if grep -qE 'CHROME_BIN|chromium|playwright|--remote-debugging-port' "$file"; then
              echo "=== skip $suite (drives a browser; Linux only)"
              continue
            fi
            if grep -q '@platform linux' "$file"; then
              echo "=== skip $suite (declares @platform linux)"
              continue
            fi
            echo "=== $suite"
            node "$file"
          done
